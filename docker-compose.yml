x-pipeline-worker: &pipeline-worker
  build:
    context: .
    dockerfile: Dockerfile
  image: iso-robot-api:latest
  env_file:
    - .env
  environment: &pipeline-worker-env
    DATABASE_PATH: /app/backend/data/db.sqlite
    DOCUMENTS_DIR: /app/all-docs
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_JSON: ${LOG_JSON:-true}
    OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-iso-robot-api}
    METRICS_PORT: ${METRICS_PORT:-9808}
    PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    # Inside compose the app always uses the bundled `postgres` service. This
    # overrides any host-oriented DB_URI in .env (which points at localhost for
    # host-based dev). It derives from the SAME POSTGRES_* vars the postgres
    # service uses, so setting POSTGRES_PASSWORD in .env updates both together.
    DB_URI: postgresql+asyncpg://${POSTGRES_USER:-iso_robot}:${POSTGRES_PASSWORD:-iso_robot}@postgres:5432/${POSTGRES_DB:-iso_robot}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
    DB_POOL_MAX_OVERFLOW: ${DB_POOL_MAX_OVERFLOW:-5}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://iso_robot:iso_robot@rabbitmq:5672//}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    MILVUS_URI: ${MILVUS_URI:-http://milvus-standalone:19530}
    MILVUS_TOKEN: ${MILVUS_TOKEN:-}
    # Shared by api + workers via ./backend/data mount — required for save_to_storage=false ingest.
    PIPELINE_INGEST_TEMP_DIR: /app/backend/data/ingest-tmp
  volumes:
    - ./backend/data:/app/backend/data
    - ./data:/app/data
    - ./all-docs:/app/all-docs
    - "./ISO ROBOT RISK POC.xlsx:/app/ISO ROBOT RISK POC.xlsx:ro"
    - prometheus_multiproc:/tmp/prometheus_multiproc
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *pipeline-worker
    container_name: iso-robot-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: *pipeline-worker-env
      # Set to "true" on first boot to create demo orgs/users (idempotent).
      RUN_SEED_DEMO: ${RUN_SEED_DEMO:-false}
    depends_on:
      postgres:
        condition: service_healthy
      milvus-standalone:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Automated pipeline: one Celery worker per queue so pools scale independently ──
  # pipeline.orchestrator — ingest_register / fan-out / pipeline_complete|failed (cheap)
  # pipeline.extract      — control extraction (Azure DI + LLM, CPU/IO heavy)
  # pipeline.llm          — issues/classify/charts/discovery/tagging (LLM-bound)
  # pipeline.scoring      — risk scoring
  worker-orchestrator:
    <<: *pipeline-worker
    container_name: iso-robot-worker-orchestrator
    command: celery -A iso_robot.celery_app worker -Q pipeline.orchestrator -c ${WORKER_ORCHESTRATOR_CONCURRENCY:-4} -E --loglevel=INFO -n orchestrator@%h
    ports:
      - "${WORKER_ORCHESTRATOR_METRICS_PORT:-9810}:9808"

  worker-extract:
    <<: *pipeline-worker
    container_name: iso-robot-worker-extract
    command: celery -A iso_robot.celery_app worker -Q pipeline.extract -c ${WORKER_EXTRACT_CONCURRENCY:-4} -E --loglevel=INFO -n extract@%h
    ports:
      - "${WORKER_EXTRACT_METRICS_PORT:-9811}:9808"

  worker-llm:
    <<: *pipeline-worker
    container_name: iso-robot-worker-llm
    command: celery -A iso_robot.celery_app worker -Q pipeline.llm -c ${WORKER_LLM_CONCURRENCY:-8} -E --loglevel=INFO -n llm@%h
    ports:
      - "${WORKER_LLM_METRICS_PORT:-9812}:9808"

  worker-scoring:
    <<: *pipeline-worker
    container_name: iso-robot-worker-scoring
    command: celery -A iso_robot.celery_app worker -Q pipeline.scoring -c ${WORKER_SCORING_CONCURRENCY:-4} -E --loglevel=INFO -n scoring@%h
    ports:
      - "${WORKER_SCORING_METRICS_PORT:-9813}:9808"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: iso-robot-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      - "${RABBITMQ_PROMETHEUS_PORT:-15692}:15692"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-iso_robot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-iso_robot}
    command: >
      sh -c "rabbitmq-plugins enable rabbitmq_management rabbitmq_prometheus &&
             rabbitmq-server"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: iso-robot-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional local Postgres — point DB_URI at this to move off SQLite (recommended
  # once more than one Celery worker writes concurrently). Not wired in by default;
  # the app falls back to the SQLite file under ./backend/data.
  postgres:
    image: postgres:16-alpine
    container_name: iso-robot-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iso_robot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iso_robot}
      POSTGRES_DB: ${POSTGRES_DB:-iso_robot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iso_robot}"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  docs:
    build:
      context: ./mint-docs
      dockerfile: Dockerfile
    image: iso-robot-docs:latest
    container_name: iso-robot-docs
    ports:
      - "${DOCS_PORT:-3005}:3005"
    environment:
      PORT: "3005"
      HOSTNAME: 0.0.0.0
      MINTLIFY_TELEMETRY_DISABLED: "1"
    restart: unless-stopped

  # Milvus Standalone (vector DB)
  # etcd (metadata) + minio (object storage) + milvus = the standard standalone
  # topology from the official Milvus docker-compose.
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  # ── Observability stack ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: iso-robot-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: iso-robot-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    container_name: iso-robot-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    container_name: iso-robot-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: iso-robot-alloy
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    depends_on:
      - loki
    restart: unless-stopped

  celery-exporter:
    image: danihodovic/celery-exporter:0.12.2
    container_name: iso-robot-celery-exporter
    ports:
      - "${CELERY_EXPORTER_PORT:-9809}:9808"
    environment:
      CE_BROKER_URL: ${CELERY_BROKER_URL:-amqp://iso_robot:iso_robot@rabbitmq:5672//}
      CE_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: iso-robot-cadvisor
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: iso-robot-node-exporter
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    restart: unless-stopped

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  rabbitmq_data:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:
  alloy_data:
  prometheus_multiproc:
