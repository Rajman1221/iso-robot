global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: iso-robot-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: iso-robot-api

  - job_name: celery-workers
    static_configs:
      - targets:
          - worker-orchestrator:9808
          - worker-extract:9808
          - worker-llm:9808
          - worker-scoring:9808
        labels:
          service: iso-robot-worker

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: rabbitmq

  - job_name: celery-exporter
    static_configs:
      - targets: ["celery-exporter:9808"]
        labels:
          service: celery-exporter

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter
